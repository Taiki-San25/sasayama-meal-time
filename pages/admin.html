<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/static/favicon.ico">
<title>管理者ページ｜グランヴィリオホテル丹波篠山　喫食時間管理表</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="/static/common.css">
<style>
  .section{margin-bottom:28px;max-width:900px}
  .section h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .section h2 .btn{margin-left:auto}
  .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:#f0e6fb;color:#6a3fa0}
  .tag.off{background:#eee;color:#888}
  .tag.front{background:#e3effc;color:#185fa5}
  .tag.restaurant{background:#fdf0e1;color:#a55a00}
  .tag.developer{background:#263238;color:#fff}
  tr.inactive td{color:#aaa}
  .slotGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .slotBox{border:1px solid var(--line);border-radius:8px;padding:12px}
  .slotBox h3{font-size:13px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px;margin-bottom:10px}
  .chip{display:inline-flex;align-items:center;gap:2px;padding:0 4px 0 10px;height:28px;border-radius:999px;
    background:var(--accent-bg);color:var(--accent);font-size:13px;font-variant-numeric:tabular-nums}
  .chip button{border:none;background:transparent;color:inherit;cursor:pointer;padding:0 4px;display:flex}
  .chip.fixed{padding-right:10px}
  .chip.fixed i{font-size:13px;margin-left:4px;opacity:.7}
  .slotAdd{display:flex;gap:6px}
  .slotAdd input{width:120px;flex:none}
  .slotAdd .btn.primary{margin-left:auto}
  .sessionInput{display:flex;align-items:center;gap:6px}
  .sessionInput input{width:90px;flex:none;text-align:right}
</style>
</head>
<body>
<div class="pageHead"><h1>管理者ページ</h1></div>

<section class="section">
  <h2><i class="ti ti-users"></i>ユーザー管理<button class="btn primary" id="addUser"><i class="ti ti-user-plus"></i>ユーザー追加</button></h2>
  <div class="tableWrap"><table class="grid">
    <thead><tr><th>ログインID</th><th>表示名</th><th>ロール</th><th>ログイン有効時間</th><th>状態</th><th></th></tr></thead>
    <tbody id="userBody"><tr><td colspan="6" class="empty">読み込み中…</td></tr></tbody>
  </table></div>
</section>

<section class="section">
  <h2><i class="ti ti-clock"></i>時間枠設定</h2>
  <div class="slotGrid">
    <div class="slotBox" data-meal="dinner"><h3><i class="ti ti-moon"></i>夕食</h3></div>
    <div class="slotBox" data-meal="breakfast"><h3><i class="ti ti-sun"></i>朝食</h3></div>
  </div>
</section>

<script src="/static/common.js"></script>
<script>
(function () {
  const { esc, api, toast, modal } = AMT;
  const ROLES = { developer: 'developer', admin: '管理者', front: 'フロント', restaurant: 'レストラン' };
  // ログイン有効時間(最後の操作から)。管理者以上は12時間で固定(サーバー側でも同じ)
  const SESSION_MAX_HOURS = 12;
  const FIXED_SESSION_ROLES = ['developer', 'admin'];
  const sessionText = u => FIXED_SESSION_ROLES.includes(u.role) ? `${SESSION_MAX_HOURS}時間<span class="muted">(固定)</span>` : `${u.session_hours}時間`;
  let meRole = null;
  // developer のアカウントは developer のみ作成・編集できる(サーバー側でも制限)
  const selectableRoles = () => Object.entries(ROLES).filter(([k]) => k !== 'developer' || meRole === 'developer');
  let users = [];
  let meId = null;

  // ---------- ユーザー ----------
  async function loadUsers() {
    users = await api('/api/users');
    document.getElementById('userBody').innerHTML = users.map(u => `
      <tr class="${u.active ? '' : 'inactive'}">
        <td>${esc(u.username)}</td>
        <td>${esc(u.display_name)}${u.id === meId ? ' <span class="muted">(自分)</span>' : ''}</td>
        <td><span class="tag ${u.role}">${ROLES[u.role] || esc(u.role)}</span></td>
        <td>${sessionText(u)}</td>
        <td>${u.active ? '有効' : '<span class="tag off">無効</span>'}</td>
        <td style="text-align:right">${u.role === 'developer' && meRole !== 'developer' ? ''
          : `<button class="btn" data-edit="${u.id}"><i class="ti ti-pencil"></i>編集</button>`}</td>
      </tr>`).join('');
  }

  function userForm(u) {
    const isNew = !u;
    const self = u && u.id === meId;
    const m = modal({
      title: isNew ? 'ユーザー追加' : `ユーザー編集(${u.username})`,
      body: `<form class="form">
        ${isNew ? `<label>ログインID(半角英数字・記号 _ . -)<input type="text" name="username" required pattern="[A-Za-z0-9_.\\-]{2,64}" autocapitalize="off"></label>` : ''}
        <label>表示名<input type="text" name="display_name" required maxlength="64" value="${esc(u ? u.display_name : '')}"></label>
        <label>${isNew ? 'パスワード(4文字以上)' : '新しいパスワード(変更する場合のみ・4文字以上)'}
          <input type="password" name="password" minlength="4" ${isNew ? 'required' : ''} autocomplete="new-password"></label>
        <label>ロール<select name="role" ${self ? 'disabled' : ''}>
          ${selectableRoles().map(([k, v]) => `<option value="${k}"${(u ? u.role : 'front') === k ? ' selected' : ''}>${v}</option>`).join('')}
        </select></label>
        <p class="muted" style="margin:-6px 0 0;font-size:12px">管理者のみ管理者ページを利用できます。フロント・レストランは管理表とチャットを利用できます。</p>
        <label>ログイン有効時間(最後の操作から)
          <span class="sessionInput"><input type="number" name="session_hours" min="1" max="${SESSION_MAX_HOURS}" step="1" required inputmode="numeric"
            value="${u ? u.session_hours : SESSION_MAX_HOURS}">時間</span></label>
        <p class="muted" style="margin:-6px 0 0;font-size:12px">1〜${SESSION_MAX_HOURS}時間。この時間なにも操作しないとログアウトします(画面の自動更新は操作に数えません)。管理者は${SESSION_MAX_HOURS}時間で固定です。</p>
        ${isNew ? '' : `<label class="check"><input type="checkbox" name="active" ${u.active ? 'checked' : ''} ${self ? 'disabled' : ''}>有効(外すとログインできなくなります)</label>`}
      </form>`,
      buttons: [{ label: 'キャンセル' }, {
        label: isNew ? '追加する' : '保存する', primary: true, onClick: async () => {
          const f = m.querySelector('form');
          if (!f.reportValidity()) return false;
          const body = { display_name: f.display_name.value, role: f.role.value };
          if (!FIXED_SESSION_ROLES.includes(f.role.value)) body.session_hours = +f.session_hours.value;
          if (isNew) {
            body.username = f.username.value.trim();
            body.password = f.password.value;
            await api('/api/users', { method: 'POST', body });
          } else {
            if (f.password.value) body.password = f.password.value;
            if (!self) body.active = f.active.checked;
            else delete body.role;
            await api(`/api/users/${u.id}`, { method: 'PUT', body });
          }
          toast(isNew ? 'ユーザーを追加しました' : '保存しました');
          await loadUsers();
        }
      }]
    });
    // 管理者以上を選んでいる間は12時間で固定(入力できない)
    const f = m.querySelector('form');
    let ownHours = f.session_hours.value;  // 管理者に切り替えて戻したときは元の時間に戻す
    const syncSession = () => {
      const fixed = FIXED_SESSION_ROLES.includes(f.role.value);
      if (fixed && !f.session_hours.disabled) ownHours = f.session_hours.value;
      f.session_hours.disabled = fixed;
      f.session_hours.value = fixed ? SESSION_MAX_HOURS : ownHours;
    };
    f.role.addEventListener('change', syncSession);
    syncSession();
  }

  document.getElementById('addUser').addEventListener('click', () => userForm(null));
  document.getElementById('userBody').addEventListener('click', e => {
    const id = e.target.closest('[data-edit]')?.dataset.edit;
    if (id) userForm(users.find(u => u.id === +id));
  });

  // ---------- 時間枠 ----------
  document.querySelectorAll('.slotBox').forEach(box => {
    const meal = box.dataset.meal;
    let slots = [];
    let fixed = [];  // 削除できない時間枠(サーバーで決めている)
    box.insertAdjacentHTML('beforeend', `
      <div class="chips"></div>
      <div class="slotAdd">
        <input type="time" step="300" aria-label="追加する時刻">
        <button class="btn" data-add><i class="ti ti-plus"></i>追加</button>
        <button class="btn primary" data-save>保存</button>
      </div>`);
    const chips = box.querySelector('.chips');
    const input = box.querySelector('input');
    const draw = () => {
      chips.innerHTML = slots.length
        ? slots.map(s => fixed.includes(s)
            ? `<span class="chip fixed" title="固定の時間枠のため削除できません">${s}<i class="ti ti-lock" aria-label="削除不可"></i></span>`
            : `<span class="chip">${s}<button data-del="${s}" aria-label="${s} を削除"><i class="ti ti-x"></i></button></span>`).join('')
        : '<span class="muted" style="font-size:13px">時間枠がありません</span>';
    };
    const add = () => {
      const v = input.value;
      if (!v) return;
      if (!slots.includes(v)) slots = [...slots, v].sort();
      input.value = '';
      draw();
    };
    box.querySelector('[data-add]').addEventListener('click', add);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    chips.addEventListener('click', e => {
      const s = e.target.closest('[data-del]')?.dataset.del;
      if (s && !fixed.includes(s)) { slots = slots.filter(x => x !== s); draw(); }
    });
    box.querySelector('[data-save]').addEventListener('click', async () => {
      slots = await api(`/api/slots/${meal}`, { method: 'PUT', body: { slots } });
      draw();
      toast(`${meal === 'dinner' ? '夕食' : '朝食'}の時間枠を保存しました`);
    });
    Promise.all([api(`/api/slots/${meal}`), api(`/api/slots/${meal}/fixed`)])
      .then(([s, f]) => { slots = s; fixed = f; draw(); }).catch(() => {});
  });

  AMT.me.then(me => { meId = me.id; meRole = me.role; return loadUsers(); }).catch(() => {});
})();
</script>
</body>
</html>
